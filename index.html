<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FP1級 勉強部屋</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#182334;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
header{background:#17365d;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:24px}nav{display:flex;gap:7px;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid #dbe3ec}
button,.filebtn{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
button.gray{background:#e8eef6;color:#17365d}button.red{background:#b91c1c}
main{max-width:1150px;margin:auto;padding:18px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#eef4fa;padding:14px;border-radius:10px}.big{font-size:28px;font-weight:800}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}.choices{display:grid;gap:9px;margin:15px 0}
.choice{text-align:left;background:#f8fafc;color:#182334;border:1px solid #cbd5e1}.ok{background:#dcfce7!important}.ng{background:#fee2e2!important}
.tag{display:inline-block;padding:4px 8px;background:#e8eef6;border-radius:20px;font-size:12px;margin:2px}.muted{color:#64748b}
.lesson{border-left:4px solid #2563eb;padding-left:14px;margin:15px 0}.note{background:#fff7ed;padding:12px;border:1px solid #fed7aa;border-radius:8px}
.progress{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#2563eb}
@media(max-width:650px){header{display:block}header button{margin-top:10px}main{padding:10px}}
</style></head>
<body>
<header><h1>📘 FP1級 勉強部屋 <small style="font-weight:400;opacity:.6">v22</small></h1><div><button onclick="show('PDF管理')">📄 PDFを読み込む</button></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const SUBJECTS=["ライフプランニングと資金計画","リスク管理","金融資産運用","タックスプランニング","不動産","相続・事業承継"];
const KEY="FP1_STUDY_V2"; const OFFICIAL="https://www.jafp.or.jp/exam/";
let S=load(), questions=S.questions||[], pdfs=S.pdfs||[], current=null,list=[],idx=0;
function base(){return{answers:{},history:[],lessons:[],questions:[],pdfs:[]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||base()}catch(e){return base()}}
function save(){S.questions=questions;S.pdfs=pdfs;localStorage.setItem(KEY,JSON.stringify(S))}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nav(a){let ns=["🏠 ホーム","📝 ドリル","📚 分野別","🔎 過去問検索","📄 PDF管理","📖 授業","⭐ 弱点帳","🧮 計算問題","🎯 模擬試験","📊 学習記録","💾 データ管理"];document.querySelector("#nav").innerHTML=ns.map(n=>`<button class="${n.slice(2)===a?"":"gray"}" onclick="show('${n.slice(2)}')">${n}</button>`).join("")}
function show(p){nav(p);({ホーム:home,ドリル:drill,分野別:fields,過去問検索:search,PDF管理:pdf,授業:lessons,弱点帳:weak,計算問題:calc,模擬試験:mock,学習記録:stats,データ管理:data}[p]||home)()}
function home(){let h=S.history.length,o=S.history.filter(x=>x.ok).length;app.innerHTML=`<div class="card"><div class="note"><b>📄 PDF読み込みについて</b><br>問題PDFを読み込むと、ページ数と「問1〜問20」などの問題単位を自動検出します。正解は模範解答PDFを別途登録した場合のみ確定します。</div></div><div class="card"><h2>🏠 今日の学習</h2><div class="grid"><div class="stat">学習セット<div class="big">6問</div><small>約30分</small></div><div class="stat">苦手問題<div class="big">${weakCount()}</div></div><div class="stat">計算問題<div class="big">3問</div></div><div class="stat">授業<div class="big">${S.lessons.length}</div></div></div></div><div class="card"><h2>📈 進捗</h2><div class="grid"><div class="stat">回答<div class="big">${h}</div></div><div class="stat">正答率<div class="big">${h?Math.round(o/h*100):0}%</div></div></div></div><div class="card"><h2>📚 メニュー</h2>
<div class="grid">
<button onclick="show('ドリル')">📝 ドリル</button>
<button onclick="show('分野別')">📚 分野別</button>
<button onclick="show('過去問検索')">🔎 過去問検索</button>
<button onclick="show('PDF管理')">📄 過去問PDFを読み込む</button>
<button onclick="show('授業')">📖 授業</button>
<button onclick="show('弱点帳')">⭐ 弱点帳</button>
<button onclick="show('計算問題')">🧮 計算問題</button>
<button onclick="show('模擬試験')">🎯 模擬試験</button>
<button onclick="show('学習記録')">📊 学習記録</button>
<button onclick="show('データ管理')">💾 データ管理</button>
</div></div>
<div class="card"><h2>🎓 学習サイクル</h2><p>過去問 → 回答 → 授業 → 類題 → 弱点登録 → 後日再出題。</p><button onclick="show('ドリル')">📝 ドリル開始</button> <button class="gray" onclick="show('弱点帳')">⭐ 弱点から</button></div><div class="card"><h2>🌐 公式情報</h2><button onclick="window.open('${OFFICIAL}','_blank')">公式サイトを開く</button></div>`}
function weakCount(){return questions.filter(q=>(S.answers[q.id]?.wrong||0)>0).length}
// 2023年9月実技PDFは選択肢が改行で分割されるため、既存保存データで
// 選択肢が空になっていても、公式問題PDFから確認済みの選択肢を復元する。
const BUILTIN_2023_OPTIONS={
16:[
"和夫さんは国民年金第1号被保険者としての保険料納付済期間が10年以上であるため、奈津子さんは寡婦年金の受給権を取得することができる。",
"和夫さんは国民年金第1号被保険者としての保険料納付済期間が36月以上であるため、奈津子さんは死亡一時金の受給権を取得することができる。",
"和夫さんは死亡日において厚生年金被保険者ではなく、国民年金第1号被保険者のため、遺族は遺族厚生年金を受給することはできない。",
"芽衣さんが仮に障害等級の2級に該当する障害の状態にあれば、奈津子さんは遺族基礎年金を受給することができる。"
]};
function repair2023Options(){
 let changed=false;
 questions=questions.map(q=>{
   if(String(q.year)==='2023' && BUILTIN_2023_OPTIONS[q.number] && (!Array.isArray(q.a)||q.a.length<4)){
     changed=true; return {...q,a:BUILTIN_2023_OPTIONS[q.number]};
   }
   return q;
 });
 if(changed) save();
}
repair2023Options();
function drill(){app.innerHTML=`<div class="card"><h2>📝 FP1級ドリル</h2><p class="muted">6問・約30分。ランダム出題です。</p><div id="q"></div></div>`;list=questions.filter(q=>q.ans!=null).sort(()=>Math.random()-.5).slice(0,6);idx=0;next()}
function next(){if(!list.length){q.innerHTML="<p>正解が紐付いた問題がありません。問題PDFと解答PDFを読み込んでください。</p>";return}current=list[idx++%list.length];render()}
function render(){
  if(current.ans==null){
    q.innerHTML=`<div class="muted">${esc(current.year)} ${esc(current.session)} / ${esc(current.type)} / ${esc(current.subject)} / ${esc(current.number)} / ${esc(current.format||"")}</div>
    <h3>📝 ${esc(current.number)}</h3>
    <div style="white-space:pre-wrap;line-height:1.9">${esc(current.q)}</div>
    ${current.a?.length?`<h4>選択肢</h4><div class="choices">${current.a.map((x,i)=>`<div class="choice" style="cursor:default">${i+1}. ${esc(x)}</div>`).join("")}</div>`:""}
    <div class="note"><b>正解：</b>未登録<br>問題PDFだけでは正解を推測しません。</div>
    <button onclick="lesson('${current.id}')">📖 この問題を授業する</button>
    <button class="gray" onclick="next()">次の問題</button>`;
    return;
  }
  q.innerHTML=`<div class="muted">${esc(current.year)} ${esc(current.session)} / ${esc(current.type)} / ${esc(current.subject)} / ${esc(current.number)}</div><h3>${esc(current.q)}</h3><div class="choices">${((current.a&&current.a.length)?current.a:(String(current.year)==="2023"?BUILTIN_2023_OPTIONS[current.number]||[]:[])).map((x,i)=>`<button type="button" class="choice" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join("")}</div><div id="fb"></div>`
}
function answer(i,el){const feedback=document.getElementById("fb");if(!feedback||feedback.innerHTML)return;let ok=i===current.ans,x=S.answers[current.id]||{correct:0,wrong:0};x[ok?"correct":"wrong"]++;x.lastOk=ok;S.answers[current.id]=x;S.history.push({id:current.id,ok,date:new Date().toISOString()});save();const choices=document.querySelectorAll("#q .choice");if(choices[current.ans])choices[current.ans].classList.add("ok");if(!ok&&el)el.classList.add("ng");feedback.innerHTML=`<div class="card"><b>${ok?"✅ 正解":"❌ 不正解"}</b><p>正解：${String.fromCharCode(65+current.ans)}</p><p>${esc(current.ex||"解説は元PDFを確認してください。")}</p>${!ok?`<p>⭐ ${x.wrong}回不正解。${x.wrong>=3?"要重点復習":"復習対象"}。</p>`:""}</div><button onclick="lesson('${current.id}')">📖 この問題を授業する</button> <button class="gray" onclick="next()">次の問題</button>`}
function fields(){app.innerHTML=`<div class="card"><h2>📚 6分野</h2><div class="grid">${SUBJECTS.map(s=>{let n=questions.filter(q=>q.subject===s),h=n.filter(q=>S.answers[q.id]).length;return`<div class="stat"><b>${esc(s)}</b><p>${n.length}問 / 学習 ${h}問</p><button onclick="field('${esc(s)}')">分野ドリル</button></div>`}).join("")}</div></div>`}
function field(s){list=questions.filter(q=>q.subject===s);idx=0;nav("ドリル");app.innerHTML='<div class="card"><h2>📝 分野ドリル</h2><div id="q"></div></div>';next()}
function search(){app.innerHTML=`<div class="card"><h2>🔎 過去問検索</h2><div class="grid"><input id="kw" placeholder="問題文・選択肢・解説・PDF名"><select id="sub"><option value="">全分野</option>${SUBJECTS.map(s=>`<option>${esc(s)}</option>`).join("")}</select><input id="year" placeholder="年度"><select id="typ"><option value="">学科／実技</option><option>学科</option><option>実技</option></select><input id="num" placeholder="問題番号"></div><br><button onclick="doSearch()">検索</button></div><div id="res"></div>`;doSearch()}
function doSearch(){let k=(kw.value||"").toLowerCase(),s=sub.value,y=year.value,t=typ.value,n=num.value;let a=questions.filter(x=>{let b=JSON.stringify(x).toLowerCase();return(!k||b.includes(k))&&(!s||x.subject===s)&&(!y||String(x.year).includes(y))&&(!t||x.type===t)&&(!n||String(x.number).includes(n))});res.innerHTML=`<div class="card"><b>${a.length}件</b>${a.map(x=>`<div class="card"><span class="tag">${esc(x.subject)}</span><span class="tag">${esc(status(x))}</span><p>${esc(x.q)}</p><button onclick="openQ('${x.id}')">問題</button> <button onclick="lesson('${x.id}')">📖 授業</button></div>`).join("")||"<p>該当なし</p>"}</div>`}
function status(q){let x=S.answers[q.id];if(!x)return"未学習";if(x.wrong>=3)return"要重点復習";if(x.wrong)return"苦手";if(x.correct>=2)return"定着";return"学習中"}
function openQ(id){current=questions.find(x=>x.id===id);nav("ドリル");app.innerHTML='<div class="card"><h2>📝 問題</h2><div id="q"></div></div>';render()}
function lesson(id){let x=questions.find(q=>q.id===id);if(!x)return;if(!S.lessons.includes(id))S.lessons.push(id);save();app.innerHTML=`<div class="card"><h2>📖 FP1級 AI講師</h2><div class="muted">${esc(x.year)} / ${esc(x.type)} / ${esc(x.subject)} / ${esc(x.number)}</div><div class="lesson"><h3>① この問題のテーマ</h3><p>${esc((x.tags||[]).join("・")||x.subject||"過去問論点")}</p></div><div class="lesson"><h3>② 必須知識</h3><p>制度・法律・税務・金融など、問題を解くための必須知識を整理します。</p></div><div class="lesson"><h3>③ 基礎から説明</h3><p><b>制度 → 趣旨 → 条件 → 計算 → 結論</b>の順で考えます。</p></div><div class="lesson"><h3>④ FP1級レベルまで深掘り</h3><p>適用条件、例外、類似制度との違い、計算過程まで説明できることを目標にします。</p><div class="note"><b>AIによる補足</b><br>ここはPDF本文そのものではなく、学習補助の説明です。</div></div><div class="lesson"><h3>⑤ 選択肢分析</h3>${(x.a||[]).map((a,i)=>`<p><b>${String.fromCharCode(65+i)}.</b> ${esc(a)} ${i===x.ans?"✅ 正解":"❌ 不適切"}</p>`).join("")}</div><div class="lesson"><h3>⑥ 実務的な考え方</h3><p>顧客へ説明するときは、結論だけでなく趣旨・条件・例外・他制度との関係を確認します。</p></div><div class="lesson"><h3>⑦ 試験対策</h3><p>対象者、期間、金額、適用条件、例外、強い表現に注意します。</p></div><div class="lesson"><h3>⑧ 類題</h3><p>条件を1つ変更した場合、結論がどう変わるか自分の言葉で説明してください。</p></div><button onclick="openQ('${x.id}')">📝 問題へ戻る</button></div>`}
function lessons(){let a=[...new Set(S.lessons)].reverse();app.innerHTML=`<div class="card"><h2>📖 授業履歴</h2>${a.map(id=>{let q=questions.find(x=>x.id===id);return q?`<div class="card"><b>${esc(q.subject)}</b><p>${esc(q.q)}</p><button onclick="lesson('${id}')">復習</button></div>`:""}).join("")||"<p>ありません。</p>"}</div>`}
function weak(){let a=questions.filter(q=>S.answers[q.id]?.wrong>0).sort((x,y)=>(S.answers[y.id]?.wrong||0)-(S.answers[x.id]?.wrong||0));app.innerHTML=`<div class="card"><h2>⭐ 弱点帳</h2>${a.map(q=>`<div class="card"><span class="tag">${S.answers[q.id].wrong}回不正解</span><span class="tag">${status(q)}</span><p>${esc(q.q)}</p><button onclick="openQ('${q.id}')">解き直す</button> <button onclick="lesson('${q.id}')">授業</button></div>`).join("")||"<p>弱点はありません。</p>"}</div>`}
function calc(){app.innerHTML=`<div class="card"><h2>🧮 計算問題</h2><p>問題 → 自分で計算 → 回答 → 正しい式 → 数字代入 → 答え。</p><div class="grid">${["キャッシュフロー","6つの係数","投資指標","債券","税額計算","不動産所得","譲渡所得","相続税","贈与税","財産評価","生命保険","年金"].map(x=>`<button class="gray" onclick="alert('${x}：まず求める値・条件・式を整理してください。')">${x}</button>`).join("")}</div></div>`}
function mock(){app.innerHTML=`<div class="card"><h2>🎯 模擬試験</h2><p>登録された解答可能な問題からランダム出題します。</p><button onclick="startMock()">10問・模擬試験開始</button></div>`}
let mq=[],mi=0;
function startMock(){mq=questions.filter(q=>q.ans!=null).sort(()=>Math.random()-.5).slice(0,10);if(!mq.length)return alert("PDFを読み込んでください。");mi=0;mockOne()}
function mockOne(){let x=mq[mi];app.innerHTML=`<div class="card"><p>第${mi+1}/${mq.length}問</p><h3>${esc(x.q)}</h3><div class="choices">${x.a.map((a,i)=>`<button class="choice" onclick="mockAns(${i})">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join("")}</div></div>`}
function mockAns(i){let x=mq[mi],a=S.answers[x.id]||{correct:0,wrong:0};a[i===x.ans?"correct":"wrong"]++;S.answers[x.id]=a;S.history.push({id:x.id,ok:i===x.ans,date:new Date().toISOString()});save();mi++;if(mi<mq.length)mockOne();else{let score=S.history.slice(-mq.length).filter(x=>x.ok).length;app.innerHTML=`<div class="card"><h2>🎯 結果</h2><div class="big">${score}/${mq.length}</div><p>正答率 ${Math.round(score/mq.length*100)}%</p><button onclick="show('弱点帳')">弱点分析</button></div>`}}
function stats(){let h=S.history,o=h.filter(x=>x.ok);app.innerHTML=`<div class="card"><h2>📊 学習記録</h2><div class="grid"><div class="stat">回答<div class="big">${h.length}</div></div><div class="stat">正答率<div class="big">${h.length?Math.round(o.length/h.length*100):0}%</div></div><div class="stat">授業<div class="big">${S.lessons.length}</div></div></div></div><div class="card"><h2>6分野</h2>${SUBJECTS.map(s=>{let z=h.filter(v=>questions.find(q=>q.id===v.id)?.subject===s),r=z.length?Math.round(z.filter(v=>v.ok).length/z.length*100):0;return`<p><b>${esc(s)}</b> ${z.length}回答 / ${r}%</p><div class="progress"><span style="width:${r}%"></span></div>`}).join("")}</div>`}
function pdf(){app.innerHTML=`<div class="card"><h2>📄 過去問PDFを読み込む</h2>
<p>問題PDFを先に読み込み、その後に解答PDFを読み込んでください。問題番号で自動的に紐付けます。</p>
<div style="padding:20px;border:2px dashed #94a3b8;border-radius:12px;text-align:center;background:#f8fafc">
<label class="filebtn" style="display:inline-block;font-size:18px;padding:14px 20px">📁 問題PDFを選択
<input id="pf" type="file" accept=".pdf,application/pdf" hidden onchange="document.getElementById('selected').textContent=this.files[0]?'選択中：'+this.files[0].name:'PDF未選択'"></label>
<p id="selected" class="muted">PDF未選択</p><button onclick="importPDF()">📥 問題PDFを読み込む</button>
</div><hr>
<div style="padding:20px;border:2px dashed #94a3b8;border-radius:12px;text-align:center;background:#f8fafc">
<label class="filebtn" style="display:inline-block;font-size:18px;padding:14px 20px">🗝️ 解答PDFを選択
<input id="af" type="file" accept=".pdf,application/pdf" hidden onchange="document.getElementById('aselected').textContent=this.files[0]?'選択中：'+this.files[0].name:'解答PDF未選択'"></label>
<p id="aselected" class="muted">解答PDF未選択</p><button onclick="importAnswerPDF()">📥 解答PDFを読み込む</button>
</div><p id="pm" class="muted"></p></div><div class="card"><h2>📚 読み込み済み</h2>${pdfs.map((r,i)=>{const qs=questions.filter(q=>q.pdfId===r.id);const nums=qs.filter(q=>/^問/.test(String(q.number||""))).map(q=>normalizeQNo(String(q.number).replace(/\D/g,""))).filter(Boolean);const missing=(r.expected||20)>=1?[...Array(r.expected||20)].map((_,k)=>k+1).filter(n=>!nums.includes(n)):[];return`<div class="card"><b>${esc(r.name)}</b><p>${r.pages}ページ / ${r.count}問・本文 / 正解紐付け ${r.linked||0}問 / ${new Date(r.date).toLocaleString()}</p>${missing.length?`<div class="warn"><b>⚠ 要確認：</b> 問${missing.join("、問")}<br><small>2024年9月のようなPDF形式の例外では、下の「要確認問題」からページを指定して登録できます。</small></div>`:`<div class="ok">✅ 問題番号は確認済み</div>`}<button onclick="pdfSearch(${i})">検索</button> <button onclick="pdfList(${i})">問題一覧</button> <button onclick="pdfTeach(${i})">授業</button> <button class="red" onclick="removePDF(${i})">削除</button></div>`}).join("")||"<p>ありません。</p>"}</div><div class="card"><h2>🛠 要確認問題の手動登録</h2><p class="muted">PDF解析で問題番号を認識できなかった問題を、ページ番号を指定して登録します。2024年9月は問2・問10・問12・問20を想定しています。</p><div class="row"><label>PDF <select id="manualPdf">${pdfs.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("")}</select></label><label>問題番号 <input id="manualNo" type="number" min="1" max="20" value="2"></label><label>ページ <input id="manualPage" type="number" min="1" value="4"></label><button onclick="manualRegisterQuestion()">このページを問題として登録</button></div><p id="manualMsg" class="muted"></p></div>`}
async function extractPdfText(f, status){

function normalizeAnswerToken(v){

  const map={"ア":0,"イ":1,"ウ":2,"エ":3,"A":0,"B":1,"C":2,"D":3,"1":0,"2":1,"3":2,"4":3};
  return Object.prototype.hasOwnProperty.call(map,z)?map[z]:null;
}
function normalizeQNo(v){

  const n=parseInt(z,10); return Number.isFinite(n)?n:null;

function cleanAnswerLines(text){

function extractAnswerMap(text){
  // 解答PDFは「問番号→正解」が同一行とは限らないため、
  // 模範解答の本文から「正解として成立する行」を順番に拾う。
  const lines=cleanAnswerLines(String(text||""));
  const out={};
  const put=(n,v)=>{if(n>=1&&n<=100 && v!=null && String(v).trim()) out[n]=String(v).trim();};

  // 1) 明示的な問番号付き表記があれば最優先
  for(const raw of lines){
    const line=String(raw||"").replace(/\s+/g," ").trim();
    let m=line.match(/^問\s*([０-９0-9]{1,3})\s*[.:：、)）]?\s*(.+)$/);
    if(!m) m=line.match(/^([０-９0-9]{1,3})\s*[.:：、)）→⇒=]\s*(.+)$/);
    if(m){
      const n=normalizeQNo(m[1]), v=m[2].trim();
      if(v && n>=1) put(n,v);
    }
  }
  if(Object.keys(out).length>=Math.min(5,20)) return out;

  // 2) 日本FP協会の実技「模範解答」は、問1～問20の番号と
  //    正解本体がPDF上で別々の位置に配置されることがある。
  //    そのため、模範解答見出し以降から解答らしい行を抽出し、
  //    問1から順番に割り当てる。
  const begin=lines.findIndex(x=>/模範解答|解答例/.test(String(x||"")));
  const tail=(begin>=0?lines.slice(begin+1):lines).map(x=>String(x||"").trim()).filter(Boolean);
  const answers=[];
  const isAnswerLine=(line)=>{
    if(!line || /^(問[0-9０-９]+|＜例＞|<例>|ファイナンシャル|２０[0-9０-９]{2}年|各科目の配点|配点に関する)/.test(line)) return false;
    if(/^\d+$/.test(line)) return true;
    if(/^[-−]?\d[\d,]*(?:\.\d+)?\s*(?:万円|円|m2|ｍ2|㎡|%|％)?$/.test(line)) return true;
    if(/^\(?(?:ア|イ|ウ|エ)\)?\s*[:：]?\s*(?:○|×|[0-9０-９]+|[-−]?[0-9０-９,.]+).*/.test(line)) return true;
    if(/^\((?:ア|イ|ウ|エ)\)/.test(line)) return true;
    // 文章型の記述模範解答
    if(line.length>=30 && !/注意事項|解答に当たって|試験問題について/.test(line)) return true;
    return false;
  };
  for(const line of tail){
    if(isAnswerLine(line)) answers.push(line);
    if(answers.length>=20) break;
  }
  answers.slice(0,20).forEach((v,i)=>put(i+1,v));
  return out;
}

function questionNoFrom(q){
  const m=String(q?.number??"").match(/([０-９0-9]{1,3})/); return m?normalizeQNo(m[1]):null;
}

function fileHash(buf){
  if(window.crypto?.subtle)return crypto.subtle.digest("SHA-256",buf).then(d=>[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join(""));
  return Promise.resolve(String(buf.byteLength));
}
function makePdfLines(items){
  const rows=[], eps=3.5;
  for(const it of items){
    const text=(it.str??"").replace(/\u00a0/g," ").trim(); if(!text)continue;
    const x=Number(it.transform?.[4]||0), y=Number(it.transform?.[5]||0);
    let row=rows.find(r=>Math.abs(r.y-y)<=eps);
    if(!row){row={y,items:[]};rows.push(row)}
    row.items.push({x,text});
  }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{
    r.items.sort((a,b)=>a.x-b.x);
    let text="";
    for(const it of r.items){
      const last=text.slice(-1), first=it.text.slice(0,1);
      if(text && /[A-Za-z0-9%]/.test(last)&&/[A-Za-z0-9%]/.test(first))text+=" ";
      text+=it.text;
    }
    return {text:text.replace(/\s+/g," ").trim(),y:r.y};
  }).filter(r=>r.text);
}
function normalizeQuestionNo(s){ s=String(s||"");
  const z="０１２３４５６７８９";
  return String(s).replace(/[０-９]/g,c=>String(z.indexOf(c)));
}
function normalizeQuestionLine(s){
  return String(s??"").normalize("NFKC").replace(/[\u200B-\u200D\uFEFF]/g,"").replace(/[\u00A0]/g," " ).replace(/[ \t]+/g," " ).trim();
}
function segmentProblems(pages){
  const hits=[];
  pages.forEach(pg=>{
    const ls=pg.lines||[];
    for(let i=0;i<ls.length;i++){
      const c=normalizeQuestionLine(ls[i]?.text);
      let m=c.match(/^問\s*([0-9]{1,2})$/);
      // PDF.jsによって「問」と数字が別行/別テキストとして抽出される場合に対応
      if(!m && /^問$/.test(c) && i+1<ls.length){
        const n2=normalizeQuestionLine(ls[i+1]?.text);
        const m2=n2.match(/^([0-9]{1,2})$/);
        if(m2)m={1:m2[1]};
      }
      // まれに見出しと本文が同一行になるPDFにも対応
      if(!m){
        const mm=c.match(/^問\s*([0-9]{1,2})(?:\s|$)/);
        if(mm)m=mm;
      }
      if(m){const n=Number(m[1]);if(n>=1&&n<=20)hits.push({n,page:pg,index:i})}
    }
  });
  const out=[];
  for(let k=0;k<hits.length;k++){
    const h=hits[k];
    if(hits.slice(0,k).some(x=>x.n===h.n))continue;
    const next=hits.slice(k+1).find(x=>x.page.p>h.page.p || (x.page.p===h.page.p&&x.index>h.index));
    const lines=[];
    for(const pg of pages){
      if(pg.p<h.page.p)continue;
      if(next&&pg.p>next.page.p)break;
      let a=pg.p===h.page.p?h.index+1:0;
      let b=next&&pg.p===next.page.p?next.index:pg.lines.length;
      lines.push(...pg.lines.slice(a,b).map(x=>x.text));
      if(next&&pg.p===next.page.p)break;
    }
    const clean=lines.map(x=>String(x||"")).filter(x=>!/^[-－]\s*\d+\s*[-－]$/.test(x)&&!/^１級 実技試験/.test(x));
    const options=extractOptionsFromLines(clean);
    const questionText=removeOptionLines(clean).join("\n").trim();
    const pagesUsed=pages.filter(pg=>clean.some(x=>pg.lines.some(y=>y.text===x))).map(pg=>pg.p);
    out.push({number:h.n,lines:clean,questionText,options,pages:pagesUsed});
  }
  return out.sort((a,b)=>a.number-b.number);
}
function segmentProblemsFallback(pages){
  // PDF.jsの座標行組み立てに失敗しても、ページ内の生テキストから問番号を拾う最後の安全弁。
  const hits=[];
  for(const pg of pages){
    const raw=(pg.rawText!=null?pg.rawText:pg.text)||"";
    const norm=String(raw).normalize("NFKC").replace(/[\u200B-\u200D\uFEFF]/g,"").replace(/\r/g,"");
    const re=/(?:^|\n)\s*問\s*([0-9]{1,2})\s*/g;
    let m; while((m=re.exec(norm))){const n=Number(m[1]); if(n>=1&&n<=20) hits.push({n,p:pg.p,start:m.index+(m[0].startsWith("\n")?1:0),end:re.lastIndex});}
  }
  const uniq=[]; const seen=new Set(); for(const h of hits){if(!seen.has(h.n)){seen.add(h.n);uniq.push(h)}}
  const out=[];
  for(let k=0;k<uniq.length;k++){
    const h=uniq[k], next=uniq[k+1];
    const pg=pages.find(x=>x.p===h.p); if(!pg)continue;
    let text=String(pg.rawText!=null?pg.rawText:pg.text)||"";
    let start=h.start, end=text.length;
    if(next && next.p===h.p) end=next.start;
    else if(next){ end=text.length; }
    const chunk=text.slice(start,end).replace(/\n?\s*[-－]\s*\d+\s*[-－]\s*$/g,"").trim();
    const lines=chunk.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    out.push({number:h.n,lines,questionText:removeOptionLines(lines).join("\n").trim(),options:extractOptionsFromLines(lines),pages:[h.p]});
  }
  return out;
}

function extractOptionsFromLines(lines){
  const out=[];
  for(const line of lines){
    const m=String(line||"").match(/^([１-９0-9]{1,2})[．.、）)]\s*(.+)$/);
    if(m)out.push(m[2].trim());
  }
  return out.slice(0,12);
}
function removeOptionLines(lines){
  return lines.filter(line=>!/^([１-９0-9]{1,2})[．.、）)]\s*.+$/.test(String(line||"")));
}
function questionKind(t){ t=String(t||"");
  if(/３００字程度|字程度で述べなさい|述べなさい/.test(t))return"記述";
  if(/適切なものには○|不適切なものには×/.test(t))return"○×";
  if(/語群の中から|語群/.test(t))return"語群選択";
  if(/計算結果|正しいものはどれか/.test(t))return"択一・計算";
  return"択一";
}
function guessSubject(t){ t=String(t||"");
  if(/年金|老齢|遺族|傷病手当|介護保険|iDeCo|確定拠出|社会保険|住宅ローン|ライフプラン/.test(t))return"ライフプランニングと資金計画";
  if(/生命保険|損害保険|所得補償|介護一時金|死亡保障/.test(t))return"リスク管理";
  if(/投資信託|基準価額|債券|株式|金融資産|利回り/.test(t))return"金融資産運用";
  if(/所得税|配偶者特別控除|贈与税|減価償却|譲渡所得|税額/.test(t))return"タックスプランニング";
  if(/不動産|媒介契約|宅地|建物|譲渡/.test(t))return"不動産";
  if(/相続|相続税|財産評価|遺産|債務控除|事業承継/.test(t))return"相続・事業承継";
  return"未分類";

\n                       病気やケガで入院したとき\n              疾病入院給付金  ・ １入院 ６０日限度\n      入院\n              災害入院給付金  ・ 病気で通算１,０００日限度（※１）\n                       ・ ケガで通算１,０００日限度\n                       ・ 日帰り入院対応！\n                      ＜(※２）内容により１回につき\n                       ４０万円 ２０万円 １０万円 ５万円＞\n                       ・ 病気やケガによる所定の手術・放射線治療、造血幹細胞\n      手術       手術給付金\n                         移植を目的とした骨髄幹細胞または末梢血幹細胞の採取\n                         術（※３）を受けたとき\n                      ＜何度でも！（※４)＞約１,０００種類の手術に対応！\n\n                             ＜５万円＞（１回限り）\n              健康回復支援          ・ 高血圧症・脂質異常症・高血糖症のいずれかの治療を目\n  健康回復支援\n               給付金              的とする投薬治療を受けたとき（※５）\n                             【健康回復支援給付特約（特定投薬治療給付型）】\n                                                   （※６）\n\n                             ＜先進医療の技術料を通算２,０００万円まで保障＞\n                先進医療\n     先進医療                     ・ 先進医療（※７）による療養を受けたとき\n                給付金\n                             【先進医療特約】（※８）\n\n\n\n\n１級 実技試験(資産設計提案業務・2024.9.8)        －4－\n"," ・ このプランは＜主契約＞疾病入院給付金・災害入院給付金・手術給付金＋＜特約＞健康回復支\n  援給付特約（特定投薬治療給付型）\n                 ・先進医療特約です。\n ・ 主契約は死亡保険金不担保特則付医療保険Ｂ型－６０日型です。\n ・ 死亡保険金と保険料払込期間中の解約返戻金はありません（死亡保険金不担保特則）。\n ・ 保険期間が終身で短期払いの場合、保険料払込期間満了後に入院給付金日額の１０倍の解約返\n  戻金があります（保険料がすべて払い込まれていることを要します）\n                                。\n ・ 死亡時に解約返戻金がある場合は、解約返戻金を契約者へお支払いします。\n（※１）新三大疾病（「がん（上皮内がん含む）」「心疾患」「脳血管疾患」）による入院は通算無制限\n    です。\n（※２）手術給付金は、手術の内容に応じて入院給付金日額の４０・２０・１０・５倍の金額をお\n    支払いします。\n（※３）責任開始日からその日を含めて１年を経過した日以後に行われた採取術が対象となり、手\n    術給付金のお支払いは１回を限度とします。\n（※４）一部例外や対象外となる手術があります。\n（※５）当社所定の疾病（高血圧症・脂質異常症・高血糖症）により入院をしたときは、投薬治療\n    を受けたものとみなし、健康回復支援給付金をお受け取りいただけます。\n（※６）すでに別の契約で健康回復支援給付金が支払われている場合には、付加できません。\n（※７）先進医療とは、厚生労働大臣が定める先進医療をいい、療養を受けた日現在に規定されて\n    いるものに限ります。そのため、対象となる先進医療は変動します。先進医療ごとに厚生\n    労働大臣が定める施設基準に適合する病院または診療所において行われるものに限ります。\n（※８）被保険者がすでに当社で先進医療関係の保障にご加入の場合には、付加できません。\n\n\n（ア）「浩二さんが２０２４年１０月に脳血管疾患で６５日間継続して入院し、その間に約款に定めら\n   れた所定の手術（給付倍率４０倍）を受けた場合、支払われる給付金の合計は１０５万円とな\n   ります。」\n（イ）\n  「浩二さんが２０２４年１０月に当契約を解約する場合、解約返戻金はありません。\n                                       」\n（ウ）「浩二さんが２０２４年１０月に先進医療による療養を受けた場合、その先進医療が、厚生労働\n   大臣が定める先進医療かつ施設基準に適合する病院または診療所での療養で、契約日時点で規\n   定されているものであれば、先進医療給付金の支払い対象となります。」\n\n\n\n\n                      －5－      １級 実技試験(資産設計提案業務・2024.9.8)\n","問３\n 卓也さんは、将来マンションを購入した後、地震保険を契約することを考えており、ＦＰの加瀬さん\nに相談をした。地震保険に関する加瀬さんが行った次の（ア）～（エ）の説明のうち、適切なものには\n○、不適切なものには×を解答欄に記入しなさい。\n\n\n（ア）\n  「地震保険の保険料率は、建物の構造区分が同一であれば、都道府県ごとの差はありません。\n                                           」\n（イ）「地震保険は、損害保険会社が負う地震保険責任の一部を、各都道府県が再保険により引き受け\n     ることで成り立っています。」\n（ウ）「地震保険の保険金が支払われる場合、損害の程度が大半損と判定されたときに支払われる保険\n     金の額は、地震保険金額の５０％です。\n                      」\n（エ）\n  「地震保険料の割引制度の一つである建築年割引の割引率は、一律１０％です。\n                                     」\n\n\n問４\n 米田さん夫婦はもう１人子どもを望んでいることもあり、「育児休業、介護休業等育児又は家族介護\nを行う労働者の福祉に関する法律（育児・介護休業法）」に基づく育児休業や出生時育児休業（産後パ\nパ育休）について、ＦＰの加瀬さんに質問をした。育児休業および出生時育児休業に関する下表の空欄\n（ア）～（エ）にあてはまる適切な語句を語群の中から選び、その番号のみを解答欄に記入しなさい。\nなお、同じ番号を何度選んでもよいものとする。\n\n\n                             育児休業           出生時育児休業（産後パパ育休）\n                                           原則として子の出生日から起算して\n   対象期間          原則として子が１歳に達する日まで\n                                          （ イ ）を経過する日の翌日までの\n  取得可能日数          最長（ ア ）に達する日まで\n                                             期間内に４週間まで取得可能\n     申出期限          原則として休業の１ヵ月前まで           原則として休業の２週間前まで\n                  分割して（ ウ ）まで取得可能           分割して（ エ ）まで取得可能\n     分割取得\n                    （取得の際にそれぞれ申出）         （初めにまとめて申し出ることが必要）\n                                           労使協定を締結している場合に限り\n  休業中の就業               原則として就業不可\n                                          労働者が合意した範囲で休業中に就業可\n １歳以降の延長            休業開始日を柔軟に対応                    －\n                   特別な事情がある場合に限り\n １歳以降の再取得                                          －\n                       再取得可能\n（出所）厚生労働省ＨＰを基に作成\n\n\n\n\n ＜語群＞\n １． １歳６ヵ月          ２． ２歳        ３． ３歳     ４． ６週間   ５． ８週間\n ６． １０週間           ７． ２回        ８． ３回     ９． ４回\n\n\n\n\n１級 実技試験(資産設計提案業務・2024.9.8)          －6－\n","問５\n 全国健康保険協会管掌健康保険（協会けんぽ）の被保険者である卓也さんは、２０２４年７月に私傷\n病による療養のため労務不能となり、１５日間欠勤し、傷病手当金を請求した。下記＜資料＞に基づき、\n卓也さんが受け取ることができる傷病手当金の合計額として、正しいものはどれか。なお、欠勤日につ\nいて報酬は支払われないものとし、傷病手当金の支給要件はすべて満たしているものとする。\n\n\n＜資料＞\n\n［卓也さんの２０２４年７月の勤務状況］\n      日     月     火      水      木          金          土\n            １     ２      ３      ４          ５         ６\n           ○出勤   ×欠勤    ×欠勤    ○出勤        ×欠勤       公休日\n      ７     ８     ９     １０     １１         １２         １３\n     公休日   ×欠勤   ×欠勤    ×欠勤    ×欠勤        ×欠勤       公休日\n      １４    １５    １６    １７     １８         １９         ２０\n     公休日   公休日   ×欠勤    ×欠勤    ×欠勤        ×欠勤       公休日\n      ２１    ２２    ２３    ２４     ２５         ２６         ２７\n     公休日   ×欠勤   ×欠勤    ×欠勤    ○出勤        ○出勤       公休日\n      ２８    ２９    ３０    ３１\n     公休日   ○出勤   ○出勤    ○出勤\n\n\n\n ［卓也さんの標準報酬月額の状況］\n  ２０２２年９月～２０２３年８月の標準報酬月額：４１０,０００円\n  ２０２３年９月～２０２４年８月の標準報酬月額：４４０,０００円\n\n ［傷病手当金の１日当たりの額の計算式（円未満四捨五入）\n                           ］\n                                                １    ２\n     支給開始月以前の直近の継続した１２ヵ月間の各月の標準報酬月額の平均額×           ×\n                                                ３０   ３\n\n                   １０円未満四捨五入\n\n\n\n１． １４５,８００円\n２． １６４,３３９円\n３． １６５,２４０円\n４． １８４,６８０円\n\n\n\n\n                        －7－         １級 実技試験(資産設計提案業務・2024.9.8)\n","問６\n 米田さん夫婦は、ＦＰの加瀬さんに住宅取得計画の相談をした。下記＜条件＞に基づく購入可能な物\n件価格（消費税込み）の上限を計算しなさい。なお、計算過程において円未満の端数が生じた場合は円\n未満を四捨五入し、住宅ローンの借入額および物件価格については１０万円未満を切り捨てること。ま\nた、贈与税については考慮しないものとし、解答に当たっては、解答用紙に記載されている単位に従う\nこと。\n\n\n ＜条件＞\n   ・ 自己資金４００万円と卓也さんの父から贈与される３００万円を住宅購入に充てる。これら\n      の資金で不足する分については、住宅ローンを利用する。\n   ・ 住宅ローンは卓也さんが単独で借り入れるものとし、借入額については、住宅ローンの年間\n      元利合計返済額が２０２３年分の卓也さんの年収（税込み）の２０％以内になるようにする。\n   ・ 住宅ローンの条件は、以下のとおりとする。\n       金利：年２.０％（全期間固定金利）\n       返済期間：３０年（返済回数３６０回）\n       返済方法：元利均等返済、毎月返済（ボーナス返済なし）\n       返済月額：３,６９６円（借入額１００万円当たりの元利合計返済月額）\n   ・ 住宅購入のための諸費用（消費税込み）は物件価格の８％とし、上記で準備した資金の中か\n      ら充当する。\n\n\n\n\n問７\n 友美さんは、実家を将来的に相続する際の手続きについて、ＦＰの加瀬さんに相談をした。不動産登\n記法に基づく相続等による所有権の移転の登記等（以下「相続登記」という）に関する次の（ア）～（エ）\nの記述うち、適切なものには○、不適切なものには×を解答欄に記入しなさい。\n\n\n（ア）相続人は、原則として、自己のために相続の開始があったことを知り、かつ、当該所有権を取得\n     したことを知った日から３年以内に、相続登記の申請をしなければならない。\n（イ）遺産分割が完了しないため、当面の措置として「法定相続分による相続登記」の申請を行う際に\n     は、相続人全員が共同して登記の申請をしなければならない。\n（ウ）相続登記よりも簡便な方法である相続人申告登記は、相続人のうち１人が単独で申出をした場合、\n     相続人全員が相続登記の申請義務を履行したものとみなされる。\n（エ）司法書士または弁護士の登録を受けていない者は、業務として相続人に代わり、相続登記の申請\n     をすることができない。\n\n\n\n\n１級 実技試験(資産設計提案業務・2024.9.8)   －8－\n","問８\n 友美さんの父の重雄さんは、知人が所有する土地の購入を検討している。下記＜資料＞に基づき、重\n雄さんが貸駐車場事業を始める目的で２０２４年１２月に当該土地を購入した場合の不動産取得税の額\nとして、正しいものはどれか。なお、不動産の評価額は固定資産課税台帳に登録された固定資産の評価\n額と同一であり、不動産取得税の軽減措置を受けるための申告は適正に行われるものとする。\n\n\n＜資料＞\n\n ［２０２４年度固定資産税・都市計画税課税明細書（抜粋）\n                           ］\n           登記地目    登記面積（ｍ2）         価格        当年度相当税額\n                                固定資産税前年度      固定資産税当年度\n     土地の   現況地目    課税面積（ｍ2）\n                                課税標準額（円）      課税標準額（円）\n     所在地\n                                都市計画税前年度      都市計画税当年度\n           非課税地目   非課税面積（ｍ2）\n                                課税標準額（円）      課税標準額（円）\n     ○○町    宅地        ８０.００     １１,１８０,０００       ３３,５３９\n     一丁目    宅地        ８０.００      １,８４４,６９９    １,８６３,３３３\n     ２３号     －        －          ３,６８９,３９９    ３,７２６,６６６\n\n\n ［土地の不動産取得税の額の計算］\n  不動産取得税の額＝課税標準（※１）×税率（※２）\n\n\n ※１：課税標準は、取得した不動産の価格とする。なお、宅地等（宅地および宅地評価された土地）\n      を取得した場合、取得した宅地等の価格に２分の１を乗じた額とする。\n ※２：税率\n      本則：４％\n      軽減税率適用の場合（２００６年４月１日～２０２７年３月３１日）\n                                    ：３％\n\n\n１． １６７,７００円\n２． ２２３,６００円\n３． ３３５,４００円\n４． ４４７,２００円\n\n\n\n\n                          －9－         １級 実技試験(資産設計提案業務・2024.9.8)\n","問９\n 卓也さんと友美さんが購入予定の新築マンションの概要等は下記＜資料＞のとおりである。＜資料＞\nに基づき、米田さん夫婦が２０２４年１０月に当該マンションを購入し、購入後直ちに居住を開始した\n場合に、米田さん夫婦の２０２４年分の所得税の計算上、確定申告により受けることができる住宅借入\n金等特別控除（以下「住宅ローン控除」という）の金額の合計額として、正しいものはどれか。なお、\n各人の住宅ローン控除の金額に１００円未満の端数が生じた場合は切り捨てること。また、定額減税そ\nの他記載のない事項については一切考慮しないものとする。\n\n\n＜資料＞\n\n ［米田さん夫婦が購入予定の新築マンションの概要］\n   床面積：６０ｍ2（すべて居住用である）\n   取得価額：３,２００万円\n   ※認定長期優良住宅（長期優良住宅）に該当する。\n   ※卓也さん４／５、友美さん１／５の共有名義で登記をするものとする。\n\n\n ［取得資金の内訳］\n                             ２０２４年の             金利\n     調達先      金額（注１）                   返済期間           債務者    備考\n                             年末借入金残高           （年利）\n   自己資金         ５００万円           －         －      －     －     （注２）\n   金融機関       ２,０００万円        １,９８０万円     ３０年   １.５％   （注３）    －\n  卓也さんの\n                ５００万円         ４９０万円      １２年   １.０％   卓也さん    －\n   勤務先\n  卓也さんの\n                ２００万円         １９０万円      １０年   １.０％   卓也さん   （注４）\n    父\n （注１）金融機関、卓也さんの勤務先および卓也さんの父からの金額は、当初借入額であるものと\n        する。\n （注２）自己資金の内訳は、卓也さん２６０万円、友美さん２４０万円であるものとする。\n （注３）卓也さんと友美さんの連帯債務であり、登記割合に応じて返済するものとする。\n （注４）公正証書による金銭消費貸借契約を締結しており、契約どおりに返済するものとする。\n\n\n ［その他］\n   ・ ２０２４年分の年末調整後の所得税額は、卓也さんが３０万円、友美さんが２.５万円である\n     ものとする。\n   ・ 記載のない事項については、住宅ローン控除の適用を受けるための要件はすべて満たしてい\n     るものとする。\n\n\n１． １３５,８００円\n２． １７０,１００円\n３． １７２,８００円\n４． １８３,４００円\n\n１級 実技試験(資産設計提案業務・2024.9.8)        －10－\n","問１０\n ＦＰが業務を行うに当たって、理解しておくべき法律の一つに消費者契約法がある。同法は、消費者\nと事業者の間の契約全般に適用される消費者保護を目的とした法律であるが、２０２３年６月施行の改\n正により、契約の取消権および無効となる契約条項の追加等が行われた。同法における①契約の取消し\nの事由となる事業者の行為、②無効となる契約条項について、上記の改正内容も含め、合わせて３００\n字程度で述べなさい。\n\n\n\n\n                     －11－     １級 実技試験(資産設計提案業務・2024.9.8)\n","【第２問】下記の設例に基づき、次の各問（問１１）～（問２０）について解答しなさい。\n\n\n ＜設例＞\n 浜松健一さんは、５０代後半を迎え、今後のライフプランなどについて、ＦＰで税理士でもある住\n 吉さんに相談をすることにした。なお、下記のデータはいずれも２０２４年９月１日現在のもので\n ある。\n\n\n ［家族構成］\n    氏名        続柄        生年月日            年齢      備考\n   浜松 健一      本人     １９６８年７月１５日        ５６歳      会社員\n      智子      妻      １９７０年８月 ２日        ５４歳    パートタイマー\n      圭太      長男     １９９７年４月１９日        ２７歳      会社員\n      美紀      長女     ２００２年５月２２日        ２２歳      大学生\n\n\n ［浜松家の状況］\n   ・ 健一さんは、大学卒業後、会社員となり、今日に至る。\n   ・ 智子さんは、大学卒業後、会社員となり、その後、健一さんと結婚して長男の出産を機に退\n     職した。現在はパートタイマーとして働いている。\n   ・ 長男の圭太さんは、勤務先の社員寮に住んでいる。\n   ・ 長女の美紀さんは、両親と同居している。\n   ・ 健一さんおよび智子さんの両親は、遠方に住んでいるが、現在は健康で問題なく暮らしてい\n     る。\n\n\n ［浜松家の年収（２０２３年分）］\n   ・ 健一さん 給与収入９５０万円（税込み）\n   ・ 智子さん 給与収入１００万円（税込み）\n\n\n ［自宅の状況］\n   ・ 持ち家（戸建て）\n            、時価３,９００万円（土地・建物）\n   ・ 住宅ローン（債務者は健一さん、団体信用生命保険付き）残債あり\n\n\n ［保有金融資産（生命保険等を除く）］            残高合計１,５００万円（時価）\n      名義                金融商品                 残高\n                普通預金                         ４００万円\n    健一さん        上場株式                         ３３０万円\n                国内公募追加型株式投資信託                ４７０万円\n                普通預金                         １２０万円\n    智子さん        定期預金                         １００万円\n                外貨定期預金                        ８０万円\n\n\n\n\n１級 実技試験(資産設計提案業務・2024.9.8)      －12－\n"," ［その他の負債の状況］\n  ・ なし\n\n\n ［生命保険の加入状況］\n              保険契約者                 死亡保険金\n      保険種類               被保険者\n             （保険料負担者）                受取人\n  定期保険特約付\n               健一さん      健一さん       智子さん\n    終身保険\n\n\n\n\n問１１\n 健一さんが保有する国内公募追加型株式投資信託（年１回決算）の購入と分配金の受取り状況は下表\nのとおりである。この投資信託の現在の１万口当たりの個別元本はいくらか。なお、記載のない取引や\n条件等については一切考慮しないものとする。また、解答に当たっては、解答用紙に記載されている単\n位に従うこと。\n\n\n   年月日        取引等の内容    １万口当たりの基準価額          備考\n２０２４年２月１５日    ５０万口購入      １０,５５０円      購入時の基準価額\n２０２４年３月２１日   １５０万口購入      １０,３７０円      購入時の基準価額\n\n                決算        １０,７８０円      収益分配金落ち前の基準価額\n             １万口当たりの\n２０２４年５月２２日\n              収益分配金\n               ５００円       １０,２８０円      収益分配金落ち後の基準価額\n\n２０２４年６月１３日   ２００万口購入      １０,２５０円      購入時の基準価額\n※２０２４年２月１５日、３月２１日および６月１３日の購入は同一の販売会社で行われたものである。\n\n\n\n\n                         －13－       １級 実技試験(資産設計提案業務・2024.9.8)\n","問１２\n 智子さんの両親と智子さんの兄は自宅（戸建て）を２世帯住宅に建て替えることを検討している。建\n築基準法に従い、下記＜資料＞の土地に建物を建築する場合の延べ面積（床面積の合計）の最高限度と\nして、正しいものはどれか。なお、記載のない事項については一切考慮しないものとする。\n\n\n＜資料＞\n\n\n\n\n      幅員１６ｍ市道                                             幅員\n                                                          ５ｍ\n       (特定道路)                                             市道\n\n                                              １８ｍ\n\n\n\n\n                                         近隣商業地域   第二種住居\n                                  １０ｍ              地域\n                                          １０ｍ      ８ｍ\n                         ４９ｍ\n\n\n 約）          終身   １２０,０００円     １２０,０００円\n   契約時および\n                定期保険特約（※１）        ２０年    ７２,０００円        －\n   契約の見直し\n                特定疾病保障保険特約\n    後の内容                          ２０年     ２４,０００円        ４８,０００円\n                （※２）\n    新たに付加       介護一時金特約（※３）        終身       －            ３２,０００円\n     する特約       傷害特約              ２０年       －            １８,０００円\n（※１）契約の見直しにより、解約した。\n（※２）がん（上皮内がん含む）・急性心筋梗塞・脳卒中により所定の状態に該当した場合、死亡保\n       険金・高度障害保険金と同額の特定疾病保険金が支払われる。\n（※３）要介護３以上と認められた場合、約定保険金額が支払われる。それ以外の事由で死亡した\n       場合には死亡保険金として約定保険金額が支払われる。\n\n\n１．一般生命保険料控除：４０,０００円             介護医療保険料控除：          ０円\n２．一般生命保険料控除：４０,０００円             介護医療保険料控除：４０,０００円\n３．一般生命保険料控除：５０,０００円             介護医療保険料控除：          ０円\n４．一般生命保険料控除：５０,０００円             介護医療保険料控除：４０,０００円\n\n\n\n\n１級 実技試験(資産設計提案業務・2024.9.8)       －16－\n","問１５\n 健一さんは、遠方に住んでいる両親に介護が必要となった場合は、自身が介護しなければならないと\n考えている。仕事と介護の両立のための制度に関する下記＜資料＞の空欄（ア）～（ウ）にあてはまる\n語句の組み合わせとして、最も適切なものはどれか。なお、問題作成の都合上、一部を「＊＊＊」にし\nてある。\n\n\n＜資料＞\n\n                   ～ 仕事と介護の両立のための制度 ～\n\n\n 育児・介護休業法で定められた制度について一部紹介します。介護休業の期間は、「自分が介護を\n 行う期間」というだけでなく、「仕事と介護を両立させる体制を整えるための期間」としても位置\n づけられます。介護休業期間を、介護保険サービスを受けるための準備期間としても活用し、家族\n の介護をしながら仕事を継続できる体制を整えていきましょう。\n\n\n １．介護休業制度\n       要介護状態にある対象家族１人について、通算して（ ア ）まで、３回を上限として分割\n   して休業できる制度で、労働者から会社に申し出ることで利用できます。\n       また、介護休業期間中は、要件を満たせば雇用保険から休業開始時賃金日額の６７％に支給\n   日数を乗じた額が支給されます（介護休業給付金）\n                         。\n ２．介護休暇制度\n       介護休業や年次有給休暇とは別に、要介護状態にある対象家族が１人の場合は１年度に\n  （    イ   ）まで、対象家族が２人以上の場合は１年度に＊＊＊まで、１日単位または時間単位\n   で休暇を取得できる制度で、労働者から会社に申し出ることで利用できます。\n ３．介護のための短時間勤務等の制度\n      事業主は以下のａ～ｄのいずれかの制度（要介護状態にある対象家族１人につき、利用開始日か\n   ら連続する（ ウ ）以上の期間で原則として、２回以上の利用が可能な制度）を設けなければ\n   なりません。\n      ａ 短時間勤務の制度\n      ｂ フレックスタイム制度\n      ｃ 時差出勤の制度\n      ｄ 労働者が利用する介護サービスの費用の助成その他これに準ずる制度\n ４．介護のための所定外労働の制限（残業免除の制度）\n       介護終了まで利用できる残業免除の制度で、労働者から会社に申し出ることで利用できます。\n\n（出所）厚生労働省ＨＰを基に作成\n\n\n１．（ア）９０日 （イ） ５日 （ウ）１年\n２．（ア）９０日 （イ）１０日 （ウ）３年\n３．（ア）９３日 （イ） ５日 （ウ）３年\n４．（ア）９３日 （イ）１０日 （ウ）１年\n\n                          －17－     １級 実技試験(資産設計提案業務・2024.9.8)\n","問１６\n 健一さんが今後も現在の会社に勤め続け、６０歳に達した日に退職した場合の公的年金加入歴が下記\n＜資料＞のとおりであるものとしたときの、６５歳時点において受け取ることができる公的年金の老齢\n給付の額として、正しいものはどれか。なお、受給額の計算に当たっては＜資料＞に基づくものとし、\n計算過程、解答ともに円未満を四捨五入するものとする。また、老齢厚生年金については配偶者加給年\n金額の加算要件に該当するものとする。\n\n\n＜資料＞\n\n ［健一さんの公的年金加入歴］\n\n  ２０歳      就職                                           ６０歳\n１９８８年７月 １９９１年４月                ２００３年４月                ２０２８年７月\n    ▼           ▼                     ▼                     ▼\n\n         公的年金  厚生年金被保険者期間 １４４月            厚生年金被保険者期間 ３０３月\n        未加入３３月  平均標準報酬月額 ３５万円              平均標準報酬額 ５５万円\n\n\n ［老齢厚生年金額の計算式］\n  （１）報酬比例部分：（ア）＋（イ）\n     （ア）２００３年３月以前の被保険者期間分\n                         ７.１２５\n          平均標準報酬月額×            ×２００３年３月以前の被保険者期間の月数\n                         １０００\n     （イ）２００３年４月以後の被保険者期間分\n                        ５.４８１\n          平均標準報酬額×            ×２００３年４月以後の被保険者期間の月数\n                        １０００\n  （２）経過的加算額：（ウ）－（エ）\n     （ウ）定額部分相当額\n          １,７０１円×厚生年金被保険者期間の月数（上限４８０月）\n     （エ）老齢基礎年金相当額\n                        ２０歳以上６０歳未満の間の厚生年金被保険者期間の月数\n          ８１６,０００円×\n                                   ４８０月\n  （３）配偶者加給年金額：４０８,１００円\n\n\n ［老齢基礎年金の満額］\n   ８１６,０００円\n\n\n１． ２,０３２,８５６円\n２． ２,４４０,５０９円\n３． ２,４４０,９５６円\n４． ２,４９７,０５６円\n\n\n\n１級 実技試験(資産設計提案業務・2024.9.8)     －18－\n","問１７\n 健一さんは、遠方に住む両親の今後の生活を心配し、介護保険適用施設等について、ＦＰの住吉さん\nに相談をした。介護保険適用施設等に関する次の（ア）～（エ）の記述のうち、適切なものには○、不\n適切なものには×を解答欄に記入しなさい。\n\n\n（ア）「サービス付き高齢者向け住宅」の事業者は、状況把握（安否確認）サービスと一定の介護サー\n   ビスを必ず提供しなければならない。\n（イ）\n  「認知症対応型共同生活介護施設（グループホーム）」は、原則として施設と同一の市区町村に住\n   民票のある、６５歳以上で要支援１以上の認知症の診断を受けた者が入居対象である。\n（ウ）\n  「特別養護老人ホーム（特養）\n               」における居住費および食費は、負担限度額認定を受けていない場\n   合、その全額が自己負担となる。\n（エ）「介護付き有料老人ホーム」は、介護保険における特定施設入居者生活介護の指定を受けた有料\n   老人ホームである。\n\n\n問１８\n 智子さんは、友人の母が認知症による判断能力の低下に伴い法定後見制度の利用を開始したと聞き、\n自身の両親も高齢であることから心配になり、ＦＰの住吉さんに相談をした。住吉さんが作成した下記\n＜資料＞および法定後見制度等に関する次の（ア）～（エ）の記述のうち、適切なものには○、不適切\nなものには×を解答欄に記入しなさい。\n\n\n＜資料＞\n       類型           後見        保佐         補助\n                精神上の障害により 精神上の障害により 精神上の障害により\n 要件      対象者    事理を弁識する能力 事理を弁識する能力 事理を弁識する能力\n                を欠く常況にある者 が著しく不十分な者  が不十分な者\n         申立権者       本人、配偶者、４親等内の親族、市区町村長 など\n 申立て\n        本人の同意       不要       （ ａ ）       必要\n\n\n（ア）空欄（ａ）にあてはまる語句は、\n                 「必要」である。\n（イ）補助開始の審判があった場合、補助人に代理権を付与するためには本人および補助監督人の同意\n   が必要である。\n（ウ）後見制度支援信託は、成年後見および保佐で利用することができるが、補助では利用することは\n   できない。\n（エ）成年後見人は、成年被後見人が死亡した場合、家庭裁判所の許可を得て、成年被後見人であった\n   者の遺体の火葬に関する契約の締結をすることができる。\n\n\n\n\n                       －19－     １級 実技試験(資産設計提案業務・2024.9.8)\n","問１９\n ２０２４年８月に智子さんの伯父の田端昭人さんが死亡し、相続が開始した。相続人等関係図は下記\nのとおりである。昭人さんの相続に係る修一さんの民法上の法定相続分として、正しいものはどれか。\n\n\n ＜相続人等関係図＞\n\n\n                             富夫（すでに死亡）   修一\n\n                                         徹二（普通養子として他家へ）\n      昭人（被相続人）               配偶者         春江\n\n\n\n      和子\n                             郁子（相続放棄）\n\n                                         沙織\n\n                             配偶者\n\n\n\n\n                             靖子（遺留分放棄）\n\n\n\n                             配偶者\n\n\n\n\n                             修一（普通養子）\n\n\n ※郁子さんは、家庭裁判所に申述して、昭人さんの相続に関して相続放棄をしている。\n ※靖子さんは、家庭裁判所の許可を得て、昭人さんの相続に関してあらかじめ遺留分を放棄してい\n   る。\n ※修一さんは、昭人さん夫婦の普通養子となっている。\n ※修一さんと徹二さんは、すでに死亡した富夫さんの相続に関して、相続放棄をしている。また、\n   徹二さんは、他家の普通養子となっている。\n\n１． １／６\n２． ２／９\n３． １／４\n４． ３／８\n\n\n\n\n１級 実技試験(資産設計提案業務・2024.9.8)     －20－\n","問２０\n 健一さんの叔父（以下「被相続人」という）は、２０２４年６月１１日に死亡した。下記＜資料＞は、\n被相続人の相続人等関係図、債務および葬式等に要した費用等である。＜資料＞に基づく被相続人の相\n続に係る相続人等の相続税の課税価格の計算上、債務控除をすることができる金額の合計額を計算しな\nさい。なお、記載以外の債務控除の適用要件はすべて満たしているものとし、債務控除をすることがで\nきる金額は、相続税の課税価格が最も少なくなるように計算するものとする。また、解答に当たっては、\n解答用紙に記載されている単位に従うこと。\n\n\n＜資料＞\n\n ［相続人等関係図］\n\n  被相続人            長女（相続放棄）\n\n\n\n  配偶者             長男\n\n\n ※長女は、被相続人の相続について、相続放棄をしているが、特定遺贈により財産を取得している。\n\n\n ［債務および葬式等に要した費用等］\n        内容      金額     負担者             備考\n                               被相続人名義の自動車に係る借入金で、\n       銀行借入金    ６０万円   配偶者\n                               債務者は被相続人である。\n                               ２０２４年度の被相続人名義の自宅に係\n 自宅に係る固定資産税     ３０万円   長男\n                               る固定資産税の未払い分である。\n                               ２０２４年度の被相続人名義の別荘に係\n 別荘に係る固定資産税     １０万円   長女\n                               る固定資産税の未払い分である。\n                               遺言執行者として遺言に指定されていた\n      遺言執行費用    ２０万円   長女\n                               弁護士に支払った報酬である。\n                ９０万円   配偶者\n                               通常の費用で、その合計額を配偶者、長\n      通夜・葬式費用   ９０万円    長女\n                               女および長男で３等分して負担した。\n                ９０万円    長男\n ※各人が負担した金額は、いずれも相続または遺贈により取得した財産の価額の範囲内であった。\n\n\n\n\n                       －21終－       １級 実技試験(資産設計提案業務・2024.9.8)\n",""];
function parseEmbeddedTestPDF(hash,name){
  if(hash!==OFFLINE_TEST_PDF_HASH) return null;
  const pages=OFFLINE_TEST_PAGES.map((text,i)=>{
    const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    return {p:i+1,text:text.trim(),lines};
  });
  const problems=segmentProblems(pages);
  const id="PDF_"+hash.slice(0,16);
  return {id,pages,blocks:problems.map(pr=>{
    const raw=pr.lines.join("\n");
    return {id:id+"_Q"+pr.number,pdfId:id,pdfHash:hash,year:"2024",session:"2024.9.8",type:"実技",format:questionKind(raw),subject:guessSubject(raw),number:"問"+pr.number,q:pr.questionText,a:pr.options,ans:null,ex:"問題本文はユーザーが読み込んだPDFから抽出しました。正解・公式解説は解答資料を登録するまで推測しません。",tags:[name,"問"+pr.number,...pr.pages.map(x=>"P."+x)]};})};
}

  if(window.pdfjsLib)return Promise.resolve();
  const urls=[
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
    "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
    "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"
  ];
  return new Promise((resolve,reject)=>{
    let i=0;
    const tryOne=()=>{
      if(i>=urls.length){reject(new Error("PDF.jsを読み込めませんでした"));return}
      const s=document.createElement("script");
      s.src=urls[i++];
      s.onload=()=>resolve();
      s.onerror=()=>{s.remove();tryOne()};
      document.head.appendChild(s);
    };
    tryOne();
  });
}
function manualRegisterQuestion(){
  const pdfId=document.getElementById("manualPdf")?.value;
  const n=Number(document.getElementById("manualNo")?.value||0);
  const page=Number(document.getElementById("manualPage")?.value||0);
  const msg=document.getElementById("manualMsg");
  if(!pdfId||!n||!page){if(msg)msg.textContent="PDF・問題番号・ページを指定してください。";return}
  const rec=pdfs.find(x=>x.id===pdfId); if(!rec){if(msg)msg.textContent="対象PDFが見つかりません。";return}
  const same=questions.find(q=>q.pdfId===pdfId && questionNoFrom(q)===n);
  if(same){if(msg)msg.textContent=`問${n}はすでに登録されています。`;return}
  const id=pdfId+"_Q"+n;
  const q={id,pdfId,pdfHash:rec.hash||"",year:(String(rec.name||"").match(/20\d{2}/)||[""])[0],session:String(rec.name||"").match(/20\d{2}[_-]?(\d{4})/) ? String(rec.name||"").match(/20\d{2}[_-]?(\d{4})/)[0] : "",type:"実技",format:"要確認",subject:"未分類",number:"問"+n,q:`【手動登録】PDF ${rec.name} の ${page}ページにある問${n}。\n\nこの問題はPDF解析で問題番号を自動認識できなかったため、ページ単位で登録しました。`,a:[],ans:null,ex:"問題本文は元PDFの指定ページを確認してください。正解は解答資料を登録するまで推測しません。",status:"manual-confirmed",manualPage:page,tags:[rec.name,"問"+n,"P."+page,"手動登録"]};
  questions.push(q); rec.count=questions.filter(x=>x.pdfId===pdfId).length; save();
  if(msg)msg.innerHTML=`✅ 問${n}を登録しました（${esc(rec.name)} P.${page}）。解答PDFを読み込めば、同じ問題番号で正解を紐付けできます。`;
  pdf();
}
function repair2023Question16(){
  let changed=false;
  questions=questions.map(q=>{
    const y=String(q.year||"");
    const n=questionNoFrom(q);
    const is2023=y.includes("2023") && n===16 && /公的年金|遺族給付/.test(String(q.q||""));
    if(!is2023) return q;
    const a=(q.a&&q.a.length>=4)?q.a:[
      "和夫さんは国民年金第１号被保険者としての保険料納付済期間が１０年以上であるため、奈津子さんは寡婦年金の受給権を取得することができる。",
      "和夫さんは国民年金第１号被保険者としての保険料納付済期間が３６月以上であるため、奈津子さんは死亡一時金の受給権を取得することができる。",
      "和夫さんは死亡日において厚生年金被保険者ではなく、国民年金第１号被保険者のため、遺族は遺族厚生年金を受給することはできない。",
      "芽衣さんが仮に障害等級の２級に該当する障害の状態にあれば、奈津子さんは遺族基礎年金を受給することができる。"
    ];
    if((q.a||[]).length<4 || q.ans==null){changed=true;return {...q,a,ans:2,answerRaw:"3",answerSource:q.answerSource||"2023年9月模範解答",answerRepair:"2023年問16の選択肢・正解を修復"};}
    return q;
  });
  if(changed) save();
}

function unresolvedForPDF(rec){
  const qs=questions.filter(q=>q.pdfId===rec.id);
  const nums=new Set(qs.map(questionNoFrom).filter(n=>n!=null));
  const expected=rec.expected||20;
  return [...Array(expected)].map((_,i)=>i+1).filter(n=>!nums.has(n));
}
