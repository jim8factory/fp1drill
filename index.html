<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FP1級 勉強部屋</title>
<style>
:root{--navy:#17365d;--blue:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#d9e1ea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:24px}h2,h3{line-height:1.45}
button,.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--blue);color:white;font-weight:700}
button.secondary,.btn.secondary{background:#e8eef7;color:var(--navy)}button.danger{background:#b91c1c}
nav{display:flex;gap:7px;flex-wrap:wrap;padding:12px 18px;background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{background:#e8eef7;color:var(--navy)}nav button.active{background:var(--navy);color:white}
main{max-width:1180px;margin:20px auto;padding:0 15px}.card{background:var(--card);border-radius:14px;padding:19px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:16px;background:#f0f5fb;border-radius:11px}.big{font-size:27px;font-weight:800}
input,select,textarea{padding:11px;border:1px solid #cbd5e1;border-radius:8px;width:100%;font:inherit}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:0 1 auto}.row .grow{flex:1 1 220px}
.choices{display:grid;gap:10px;margin-top:17px}.choice{text-align:left;background:#f7f9fc;color:var(--text);border:1px solid #ccd5e2}.choice:hover{background:#eaf1ff}
.correct{background:#dcfce7!important;border-color:#16a34a!important}.wrong{background:#fee2e2!important;border-color:#dc2626!important}
.muted{color:var(--muted)}.hidden{display:none}.result{padding:13px;border-radius:9px;margin-top:12px}.tag{display:inline-block;background:#e8eef7;border-radius:99px;padding:4px 9px;margin:3px;font-size:12px}
.lesson{border-left:4px solid var(--blue);padding-left:14px;margin:14px 0}.important{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:9px}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--blue)}
.small{font-size:13px}.timer{font-size:28px;font-weight:800}.score{font-size:38px;font-weight:900}
@media(max-width:650px){header{align-items:flex-start;flex-direction:column}h1{font-size:20px}nav{position:static}.card{padding:15px}}
footer{color:var(--muted);text-align:center;padding:30px}
</style>
</head>
<body>
<header><h1>📘 FP1級 勉強部屋</h1><button onclick="downloadHTML()">⬇️ HTMLを保存</button></header>
<nav id="nav"></nav><main id="app"></main>
<footer>学習記録・PDF登録情報はこのブラウザのlocalStorageに保存されます。PDF本文とAI補足は明確に区別して扱います。</footer>

<script>
const APP="fp1";
const OFFICIAL="https://fair.jafp.or.jp/exam/mohan/";
const subjects=["ライフプランニングと資金計画","リスク管理","金融資産運用","タックスプランニング","不動産","相続・事業承継"];
let questions=[
{id:"demo1",year:"2026",session:"デモ",type:"学科",subject:"金融資産運用",number:"Demo-1",q:"投資判断を行う際、単純な利回りだけでなくリスクとリターンの関係を考える理由として最も適切なものはどれか。",a:["収益率が高ければ必ず安全だから","将来の収益には不確実性があり、同じ収益でもリスクが異なるから","税金が必ずゼロになるから","すべての金融商品は同じリスクだから"],ans:1,ex:"FP1級では数値だけでなく、その数値が示す意味まで理解します。期待収益率とリスクはセットで考え、顧客の目的・期間・許容度との整合性を確認します。",tags:["リスクとリターン","投資判断"],kind:"知識"},
{id:"demo2",year:"2026",session:"デモ",type:"学科",subject:"相続・事業承継",number:"Demo-2",q:"相続税の学習で、個別の税額だけを暗記するのではなく制度の全体像を理解する順序として適切なものはどれか。",a:["税額→制度趣旨→対象→条件","制度→趣旨→条件→計算→結論","結論→暗記→制度→計算","数字だけを暗記する"],ans:1,ex:"本アプリではFP1級向けに「制度→趣旨→条件→計算→結論」の順で理解する設計にしています。",tags:["相続税","制度理解"],kind:"知識"},
{id:"demo3",year:"2026",session:"デモ",type:"学科",subject:"タックスプランニング",number:"Demo-3",q:"所得税の計算過程を理解するうえで、所得控除と税額控除を区別する理由として適切なものはどれか。",a:["どちらも同じ段階で控除するから","所得控除は課税所得の計算、税額控除は算出税額からの控除に関係するから","税額控除は所得を増やすから","所得控除は必ず税額から直接引くから"],ans:1,ex:"所得控除と税額控除は計算上の位置が異なります。FP1級では制度名だけでなく、どの段階に作用するかを説明できることを重視します。",tags:["所得控除","税額控除"],kind:"計算"},
{id:"demo4",year:"2026",session:"デモ",type:"学科",subject:"ライフプランニングと資金計画",number:"Demo-4",q:"6つの係数を使うときに最も重要な考え方はどれか。",a:["係数名だけを暗記し、資金の流れを考えない","何を求めたいのか、現在価値・将来価値・積立・取崩し等の目的を確認する","常に同じ係数を使う","期間と利率は無視する"],ans:1,ex:"係数は計算を簡略化する道具です。まず資金の流れと求めたい値を特定し、その後に適切な係数を選びます。",tags:["6つの係数","資金計画"],kind:"計算"},
{id:"demo5",year:"2026",session:"デモ",type:"実技",subject:"不動産",number:"Demo-5",q:"不動産の収益性を比較するとき、表面利回りだけで判断することの問題点として適切なものはどれか。",a:["経費や空室等を考慮できない場合がある","必ず税金がゼロになる","土地価格が必ず一定になる","すべての物件で同じ結果になる"],ans:0,ex:"表面利回りは収入と価格の単純な関係を見る指標で、実際の収益性を評価するには経費、空室、借入条件、税務なども確認する必要があります。",tags:["不動産投資","利回り"],kind:"応用"}
];
let state=loadJSON("state",{answers:{},history:[],favorites:[],lessons:[],pdfs:[],mock:[]});
let current=null,currentList=questions,currentIndex=0,mockTimer=null,mockRemaining=0,mockQuestions=[];

function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(APP+k))||d}catch(e){return d}}
function save(){localStorage.setItem(APP+"state",JSON.stringify(state))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function nav(active="ホーム"){document.getElementById("nav").innerHTML=[
["🏠","ホーム"],["📝","ドリル"],["📚","分野別"],["🔎","過去問検索"],["📄","PDF管理"],["📖","授業"],["⭐","弱点帳"],["🧮","計算問題"],["🎯","模擬試験"],["📊","学習記録"],["💾","データ管理"]
].map(x=>`<button class="${active===x[1]?'active':''}" onclick="show('${x[1]}')">${x[0]} ${x[1]}</button>`).join("")}
function show(page){nav(page);let a=document.getElementById("app");({ホーム:home,ドリル:drill,分野別:subjectsPage,過去問検索:search,PDF管理:pdfManage,授業:lessonPage,弱点帳:weak,計算問題:calcPage,模擬試験:mockPage,学習記録:stats,データ管理:data}[page]||home)(a)}
function allQuestions(){return questions}
function answerStats(){let vals=Object.values(state.answers);return {n:vals.length,ok:vals.filter(x=>x.lastOk).length,wrong:vals.filter(x=>x.wrong>0).length}}
function rate(){let h=state.history;return h.length?Math.round(h.filter(x=>x.ok).length/h.length*100):0}
function mastery(q){let x=state.answers[q.id];if(!x)return "未学習";if(x.wrong>=3)return "要重点復習";if(x.correct>=2&&x.wrong===0)return "定着";return x.wrong?"苦手":"学習中"}
function home(a){
let st=answerStats(), weakN=questions.filter(q=>state.answers[q.id]?.wrong>0).length;
a.innerHTML=`<div class="card"><h2>🏠 今日の学習</h2><div class="grid">
<div class="stat">新しい問題<div class="big">5問</div></div><div class="stat">苦手問題<div class="big">5問</div></div><div class="stat">計算問題<div class="big">3問</div></div><div class="stat">授業<div class="big">2問</div></div></div></div>
<div class="card"><h2>📈 現在の進捗</h2><div class="grid"><div class="stat">回答数<div class="big">${st.n}</div></div><div class="stat">正答率<div class="big">${rate()}%</div></div><div class="stat">弱点<div class="big">${weakN}</div></div><div class="stat">授業受講<div class="big">${state.lessons.length}</div></div></div></div>
<div class="card"><h2>🎓 FP1級学習サイクル</h2><p>過去問を解く → 間違える → <b>AI講師形式の授業</b> → 類題 → 弱点登録 → 間隔を空けて再出題、の流れで学習します。</p><div class="row"><button onclick="show('ドリル')">📝 まず5問解く</button><button onclick="show('弱点帳')" class="secondary">⭐ 弱点から開始</button><button onclick="show('模擬試験')" class="secondary">🎯 模試を開始</button></div></div>
<div class="card"><h2>📚 公式情報</h2><p>最新の試験情報・過去問等は公式サイトで確認してください。</p><button onclick="window.open(OFFICIAL,'_blank')">公式ページを開く</button></div>`}
function drill(a){a.innerHTML=`<div class="card"><h2>📝 FP1級 過去問ドリル</h2><div id="qbox"></div></div>`;currentList=questions;currentIndex=0;nextQuestion()}
function nextQuestion(list=currentList){if(list!==currentList){currentList=list;currentIndex=0}if(!list.length){document.getElementById("qbox").innerHTML="<p>該当する問題がありません。</p>";return}current=list[currentIndex%list.length];currentIndex++;renderQ()}
function renderQ(){let b=document.getElementById("qbox");if(!b)return;b.innerHTML=`<div class="muted">${esc(current.year)}年 / ${esc(current.session)} / ${esc(current.type)} / ${esc(current.subject)} / ${esc(current.number)}</div><h3>${esc(current.q)}</h3><div>${(current.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="choices">${current.a.map((x,i)=>`<button class="choice" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join("")}</div><div id="feedback"></div>`}
function answer(i,el){let f=document.getElementById("feedback");if(f.innerHTML)return;let ok=i===current.ans,id=current.id,x=state.answers[id]||{correct:0,wrong:0,streak:0};x[ok?"correct":"wrong"]++;x.streak=ok?x.streak+1:0;x.lastOk=ok;x.last=new Date().toISOString();state.answers[id]=x;state.history.push({id,ok,date:x.last});if(!ok&&!state.favorites.includes(id)&&x.wrong>=1){}save();document.querySelectorAll(".choice")[current.ans].classList.add("correct");if(!ok)el.classList.add("wrong");f.innerHTML=`<div class="result ${ok?'correct':'wrong'}"><b>${ok?'✅ 正解':'❌ 不正解'}</b><br><b>正解：</b>${String.fromCharCode(65+current.ans)}<p>${esc(current.ex)}</p>${!ok?`<div class="important">⭐ 弱点帳：${x.wrong>=3?'要重点復習':'復習対象'}（${x.wrong}回不正解）</div>`:""}</div><div class="row"><button onclick="lesson('${id}')">📖 この問題を授業する</button><button class="secondary" onclick="nextQuestion()">次の問題 →</button></div>`}
function openQ(id){current=questions.find(q=>q.id===id);show("ドリル");renderQ()}
function subjectsPage(a){a.innerHTML=`<div class="card"><h2>📚 6分野</h2><div class="grid">${subjects.map(s=>{let qs=questions.filter(q=>q.subject===s),h=qs.reduce((n,q)=>n+(state.answers[q.id]?1:0),0),r=qs.length?Math.round(h/qs.length*100):0;return `<div class="stat"><b>${esc(s)}</b><p>${qs.length}問 / 学習 ${h}問</p><div class="progress"><i style="width:${r}%"></i></div><br><button onclick="subjectDrill('${esc(s)}')">分野ドリル</button></div>`}).join("")}</div></div>`}
function subjectDrill(s){currentList=questions.filter(q=>q.subject===s);show("ドリル")}
function search(a){a.innerHTML=`<div class="card"><h2>🔎 過去問検索</h2><div class="grid">
<input id="kw" placeholder="問題文・選択肢・解説・キーワード・PDF名">
<select id="sy"><option value="">全分野</option>${subjects.map(s=>`<option>${esc(s)}</option>`).join("")}</select>
<select id="yy"><option value="">全年度</option>${[...new Set(questions.map(q=>q.year))].sort().reverse().map(y=>`<option>${esc(y)}</option>`).join("")}</select>
<select id="ty"><option value="">学科／実技</option><option>学科</option><option>実技</option></select>
<select id="st"><option value="">学習状態</option><option value="wrong">間違えた</option><option value="unanswered">未回答</option><option value="weak">苦手</option></select>
<input id="qn" placeholder="問題番号">
</div><br><button onclick="doSearch()">検索</button></div><div id="results"></div>`;doSearch()}
function doSearch(){let k=(document.getElementById("kw").value||"").toLowerCase(),s=document.getElementById("sy").value,y=document.getElementById("yy").value,t=document.getElementById("ty").value,st=document.getElementById("st").value,n=document.getElementById("qn").value.trim();let qs=questions.filter(q=>{let blob=JSON.stringify(q).toLowerCase(),x=state.answers[q.id];return(!k||blob.includes(k))&&(!s||q.subject===s)&&(!y||q.year===y)&&(!t||q.type===t)&&(!n||String(q.number).includes(n))&&(!st||(st==="wrong"&&x?.wrong>0)||(st==="unanswered"&&!x)||(st==="weak"&&x?.wrong>0))});document.getElementById("results").innerHTML=`<div class="card"><b>${qs.length}件</b>${qs.map(q=>`<div class="card"><span class="tag">${esc(q.year)}</span><span class="tag">${esc(q.subject)}</span><span class="tag">${mastery(q)}</span><h3>${esc(q.q)}</h3><button onclick="openQ('${q.id}')">問題を見る</button> <button onclick="lesson('${q.id}')">📖 授業</button></div>`).join("")||"<p>該当なし</p>"}</div>`}
function lesson(id){let q=questions.find(x=>x.id===id);if(!q)return;state.lessons=state.lessons.filter(x=>x!==id);state.lessons.push(id);save();let correct=String.fromCharCode(65+q.ans);document.getElementById("app").innerHTML=`<div class="card"><div class="muted">${esc(q.year)}年 / ${esc(q.type)} / ${esc(q.subject)} / ${esc(q.number)}</div><h2>📖 FP1級 AI講師授業</h2>
<div class="lesson"><h3>① この問題のテーマ</h3><p>「${esc((q.tags||[]).join("・")||q.subject)}」を中心に、${esc(q.subject)}の論点を問う問題です。まず何を問われているかを特定します。</p></div>
<div class="lesson"><h3>② 必須知識</h3><p>FP1級では、制度名・数字だけでなく、<b>制度の目的、対象者、適用条件、例外、計算上の位置づけ</b>を関連づけて理解します。</p></div>
<div class="lesson"><h3>③ 基礎から説明</h3><p>考え方の基本は「制度 → 趣旨 → 条件 → 計算 → 結論」です。問題文の数字や用語を見たら、まずどの制度・計算段階に属するかを確認します。</p></div>
<div class="lesson"><h3>④ FP1級レベルまで深掘り</h3><div class="important">FP1級では、単純暗記ではなく、類似制度との違い・適用条件・例外・計算過程まで説明できる状態を目指します。最新制度の数値・法令は試験基準日に注意してください。</div><p><b>AIによる補足：</b>この段落は読み込んだ過去問本文そのものではなく、学習を助けるための一般的な補足です。</p></div>
<div class="lesson"><h3>⑤ 選択肢分析</h3>${q.a.map((x,i)=>`<p><b>${String.fromCharCode(65+i)}.</b> ${esc(x)} ${i===q.ans?'✅ 正解':'❌ 不適切'}</p>`).join("")}</div>
<div class="lesson"><h3>⑥ 実務的な考え方</h3><p>FPとして顧客に説明するときは、結論だけでなく「なぜ適用されるのか」「どの条件で変わるのか」「他の制度とどう関係するか」を確認します。</p></div>
<div class="lesson"><h3>⑦ 試験対策</h3><p>数字・期間・対象者・適用条件・例外、「必ず」「すべて」「のみ」などの強い表現に注意します。正解を選ぶだけでなく、他の選択肢がなぜ誤りか説明できるようにします。</p></div>
<div class="lesson"><h3>⑧ 類題</h3><p>「この論点について、条件を1つ変更した場合、結論はどう変わるか？」を自分で説明してみましょう。</p></div>
<p><b>この問題の正解：</b>${correct}</p><div class="row"><button onclick="openQ('${id}')">📝 問題に戻る</button><button onclick="lessonNext('${esc(q.subject)}')">➡️ 同分野の授業</button><button class="secondary" onclick="show('過去問検索')">🔎 検索へ</button></div></div>`}
function lessonNext(s){let qs=questions.filter(q=>q.subject===s);if(qs.length)lesson(qs[Math.floor(Math.random()*qs.length)].id)}
function lessonPage(a){let ids=[...new Set(state.lessons)].reverse();a.innerHTML=`<div class="card"><h2>📖 授業</h2><p>受講履歴 ${ids.length}問</p>${ids.map(id=>{let q=questions.find(x=>x.id===id);return q?`<div class="card"><b>${esc(q.subject)}</b><p>${esc(q.q)}</p><button onclick="lesson('${q.id}')">授業を復習</button></div>`:""}).join("")||"<p>まだ授業を受講していません。</p>"}</div>`}
function weak(a){let qs=questions.filter(q=>state.answers[q.id]?.wrong>0).sort((x,y)=>(state.answers[y.id]?.wrong||0)-(state.answers[x.id]?.wrong||0));a.innerHTML=`<div class="card"><h2>⭐ 弱点帳</h2><p>間違えた問題を自動登録。3回以上は「要重点復習」です。</p>${qs.map(q=>{let x=state.answers[q.id];return `<div class="card"><span class="tag">${x.wrong}回不正解</span><span class="tag">${mastery(q)}</span><b>${esc(q.subject)}</b><p>${esc(q.q)}</p><button onclick="openQ('${q.id}')">解き直す</button> <button onclick="lesson('${q.id}')">📖 授業</button></div>`}).join("")||"<p>まだ間違えた問題はありません。</p>"}</div>`}
function calcPage(a){a.innerHTML=`<div class="card"><h2>🧮 計算問題モード</h2><p>FP1級では「式を覚える」だけでなく、何を求める計算かを確認します。</p><div class="grid">${["キャッシュフロー","6つの係数","投資指標","債券","税額計算","不動産所得","譲渡所得","相続税","贈与税","財産評価","生命保険","年金"].map(t=>`<button class="secondary" onclick="calcLesson('${t}')">${t}</button>`).join("")}</div><div id="calcbox"></div></div>`}
function calcLesson(t){document.getElementById("calcbox").innerHTML=`<div class="card"><h3>🧮 ${esc(t)}</h3><p><b>問題 → 自分で計算 → 回答 → 正しい計算式 → 数字を代入 → 答え</b>の順で確認します。</p><p>まず「何を求めるのか」「与えられた数値」「期間」「利率」「税率等」を整理してください。</p><textarea rows="5" placeholder="ここに自分の計算・理由を書いてください"></textarea><br><br><button onclick="alert('自己採点用：式→代入→計算結果→単位・条件の順に確認してください。')">回答を確認</button></div>`}
function pdfManage(a){let rec=state.pdfs||[];a.innerHTML=`<div class="card"><h2>📄 過去問PDFを読み込む</h2><p>ユーザーが取得したPDFをローカルに読み込みます。本文はブラウザ内の検索対象として利用します。</p><label class="btn">📄 PDFを選択<input id="pdfInput" type="file" accept=".pdf,application/pdf" hidden onchange="importPDF(event)"></label><p id="pdfStatus" class="muted">PDF.jsは必要時にCDNから読み込みます。</p></div><div class="card"><h2>📚 読み込み済み過去問</h2>${rec.map((r,i)=>`<div class="card"><b>${esc(r.name)}</b><p>${esc(r.year||"年度未設定")} / ${esc(r.session||"試験回未設定")} / ${esc(r.type||"未設定")} / ${r.pages}ページ / 登録問題 ${r.added}件<br><span class="small">読み込み：${new Date(r.date).toLocaleString()}</span></p><button onclick="searchPdf('${i}')">検索</button> <button onclick="pdfQuestions('${i}')">問題一覧</button> <button onclick="pdfLesson('${i}')">授業</button> <button class="danger" onclick="deletePdf('${i}')">削除</button></div>`).join("")||"<p>まだPDFはありません。</p>"}</div>`}
async function importPDF(e){let f=e.target.files[0];if(!f)return;let st=document.getElementById("pdfStatus");st.textContent="PDFを読み込んでいます…";try{await loadPdfJs();let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,added=0,texts=[];for(let n=1;n<=pdf.numPages;n++){let page=await pdf.getPage(n),tc=await page.getTextContent(),text=tc.items.map(x=>x.str).join(" ").replace(/\\s+/g," ").trim();if(text){texts.push({page:n,text});added++}}let rec={id:"pdf-"+Date.now(),name:f.name,pages:pdf.numPages,added,date:new Date().toISOString(),year:(f.name.match(/20\\d{2}/)||["PDF"])[0],session:"",type:"",texts};state.pdfs.push(rec);for(let z of texts)questions.push({id:rec.id+"-"+z.page,year:rec.year,session:rec.session,type:rec.type||"PDF",subject:"PDF過去問",number:"P."+z.page,q:rec.name+" / "+z.page+"ページ\\n"+z.text.slice(0,2200),a:["PDF本文を確認する","PDF本文を確認する","PDF本文を確認する","PDF本文を確認する"],ans:null,ex:"PDF本文から抽出したテキストです。正解・公式解説は元PDFを確認してください。AI補足はPDF本文とは別情報として扱います。",tags:[rec.name,"PDF","P."+z.page],kind:"PDF"});save();st.textContent=`✅ ${f.name} を登録しました（${pdf.numPages}ページ、テキスト抽出 ${added}ページ）。`;pdfManage(document.getElementById("app"))}catch(err){console.error(err);st.textContent="❌ PDFを読み込めませんでした。画像だけのPDF・暗号化PDF等は対応できない場合があります。"}}
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve();return new Promise((resolve,reject)=>{let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js";s.onload=()=>{if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js";resolve()}else reject(new Error("PDF.js unavailable"))};s.onerror=reject;document.head.appendChild(s)})}
function searchPdf(i){let r=state.pdfs[i];show("過去問検索");setTimeout(()=>{document.getElementById("kw").value=r.name;doSearch()},0)}
function pdfQuestions(i){let r=state.pdfs[i],qs=questions.filter(q=>q.id.startsWith(r.id+"-"));document.getElementById("app").innerHTML=`<div class="card"><h2>📄 ${esc(r.name)} 問題一覧</h2>${qs.map(q=>`<div class="card"><b>${esc(q.number)}</b><p>${esc(q.q)}</p><button onclick="openQ('${q.id}')">開く</button></div>`).join("")}</div>`}
function pdfLesson(i){let r=state.pdfs[i],q=questions.find(x=>x.id.startsWith(r.id+"-"));if(q)lesson(q.id)}
function deletePdf(i){if(!confirm("このPDFの登録情報と抽出問題を削除しますか？"))return;let id=state.pdfs[i].id;questions=questions.filter(q=>!q.id.startsWith(id+"-"));state.pdfs.splice(i,1);save();pdfManage(document.getElementById("app"))}
function mockPage(a){a.innerHTML=`<div class="card"><h2>🎯 FP1級 模擬試験</h2><div class="grid"><label>問題数<select id="mn"><option>10</option><option>20</option><option>30</option></select></label><label>制限時間（分）<select id="mt"><option>15</option><option>30</option><option>60</option></select></label><label>分野<select id="ms"><option value="">全分野</option>${subjects.map(s=>`<option>${esc(s)}</option>`).join("")}</select></label></div><br><button onclick="startMock()">模擬試験を開始</button><p class="muted">本番形式の練習用。終了後に分野別成績と弱点を表示します。</p></div>`}
function startMock(){let n=+document.getElementById("mn").value,t=document.getElementById("mt").value*60,s=document.getElementById("ms").value;mockQuestions=[...questions.filter(q=>(!s||q.subject===s)&&q.ans!==null)].sort(()=>Math.random()-.5).slice(0,n);if(!mockQuestions.length){alert("出題できる問題がありません");return}mockRemaining=t;currentIndex=0;renderMock();clearInterval(mockTimer);mockTimer=setInterval(()=>{mockRemaining--;let el=document.getElementById("mockTimer");if(el)el.textContent=formatTime(mockRemaining);if(mockRemaining<=0){clearInterval(mockTimer);finishMock()}},1000)}
function formatTime(n){return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function renderMock(){let q=mockQuestions[currentIndex];document.getElementById("app").innerHTML=`<div class="card"><div class="row"><span>第${currentIndex+1}/${mockQuestions.length}問</span><span id="mockTimer" class="timer">${formatTime(mockRemaining)}</span></div><h3>${esc(q.q)}</h3><div class="choices">${q.a.map((x,i)=>`<button class="choice" onclick="mockAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join("")}</div></div>`}
function mockAnswer(i){let q=mockQuestions[currentIndex],x=state.answers[q.id]||{correct:0,wrong:0,streak:0};x[i===q.ans?"correct":"wrong"]++;x.lastOk=i===q.ans;state.answers[q.id]=x;state.history.push({id:q.id,ok:i===q.ans,date:new Date().toISOString()});save();currentIndex++;if(currentIndex>=mockQuestions.length)finishMock();else renderMock()}
function finishMock(){clearInterval(mockTimer);let total=mockQuestions.length,ok=mockQuestions.filter(q=>state.history.findLast?.(h=>h.id===q.id)?.ok).length;state.mock.push({date:new Date().toISOString(),total,ok});save();document.getElementById("app").innerHTML=`<div class="card"><h2>🎯 模擬試験 結果</h2><div class="score">${ok}/${total}</div><p>正答率 ${total?Math.round(ok/total*100):0}%</p><button onclick="show('模擬試験')">もう一度</button> <button onclick="show('弱点帳')">弱点分析</button></div>`}
function stats(a){a.innerHTML=`<div class="card"><h2>📊 学習記録</h2><div class="grid"><div class="stat">総回答数<div class="big">${state.history.length}</div></div><div class="stat">正解<div class="big">${state.history.filter(x=>x.ok).length}</div></div><div class="stat">不正解<div class="big">${state.history.filter(x=>!x.ok).length}</div></div><div class="stat">正答率<div class="big">${rate()}%</div></div></div></div><div class="card"><h2>6分野別</h2>${subjects.map(s=>{let qs=questions.filter(q=>q.subject===s),h=qs.flatMap(q=>state.history.filter(x=>x.id===q.id)),r=h.length?Math.round(h.filter(x=>x.ok).length/h.length*100):0;return `<p><b>${esc(s)}</b>：${h.length}回答 / ${r}%</p><div class="progress"><i style="width:${r}%"></i></div>`}).join("")}</div><div class="card"><h2>🎯 定着状況</h2><p>未学習 → 学習中 → 定着。3回以上の不正解は要重点復習として優先します。</p></div>`}
function data(a){a.innerHTML=`<div class="card"><h2>💾 データ管理</h2><p>学習履歴、弱点、授業履歴、PDF登録情報などをJSONで保存・復元します。</p><div class="row"><button onclick="downloadData()">JSON保存</button><label class="btn">JSONから復元<input type="file" accept=".json" hidden onchange="loadData(event)"></label><button class="danger" onclick="resetData()">学習記録をリセット</button></div></div><div class="card"><h2>📄 PDF</h2><p>PDF本文はユーザーが取得したものを読み込む方式です。自動再配布は行いません。</p><button onclick="show('PDF管理')">PDF管理を開く</button></div>`}
function downloadData(){download("fp1-learning.json",JSON.stringify(state,null,2),"application/json")}
function loadData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();show("ホーム")}catch{alert("JSONを読み込めませんでした")}};r.readAsText(f)}
function resetData(){if(confirm("学習記録をリセットしますか？")){state={answers:{},history:[],favorites:[],lessons:[],pdfs:[],mock:[]};save();show("ホーム")}}
function download(name,text,type){let b=new Blob([text],{type}),u=URL.createObjectURL(b),x=document.createElement("a");x.href=u;x.download=name;x.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function downloadHTML(){download("FP1級_勉強部屋.html","<!doctype html>\\n"+document.documentElement.outerHTML,"text/html")}
show("ホーム");
</script>
</body>
</html>
